<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北辰テスト 成績分析</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7c3aed;
      --purple-light: #ede9fe;
      --purple-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --green-line: #06c755;
      --green-dark: #059444;
      --red: #dc2626;
      --amber: #d97706;
      --emerald: #059669;
      --gray-bg: #f4f6fa;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN',
                   'Noto Sans JP', sans-serif;
      background: var(--gray-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--purple-grad);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
    }
    .header h1 { font-size: 21px; font-weight: 800; letter-spacing: .5px; }
    .header p  { font-size: 13px; opacity: .85; margin-top: 5px; }

    /* ── Layout ── */
    .container {
      max-width: 580px;
      margin: 0 auto;
      padding: 18px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,.07);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2.5px dashed #c4b5fd;
      border-radius: 12px;
      padding: 30px 16px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: var(--purple-light);
      user-select: none;
    }
    .upload-zone:hover,
    .upload-zone.drag-over { border-color: var(--purple); background: #ddd6fe; }
    .upload-icon { font-size: 38px; margin-bottom: 8px; }
    .upload-label { font-size: 14px; color: #4c1d95; font-weight: 600; }
    .upload-sub { font-size: 12px; color: #7c3aed; margin-top: 4px; }
    #fileInput, #cameraInput { display: none; }

    /* ── Thumbnail grid ── */
    .thumb-grid {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .thumb-grid.visible { display: grid; }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--gray-bg);
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-delete {
      position: absolute;
      top: 3px; right: 3px;
      width: 22px; height: 22px;
      background: rgba(0,0,0,.65);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-add {
      aspect-ratio: 1;
      border: 2px dashed #c4b5fd;
      border-radius: 8px;
      background: var(--purple-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
      color: var(--purple);
      transition: background .2s, border-color .2s;
    }
    .thumb-add:hover { background: #ddd6fe; border-color: var(--purple); }
    .thumb-count {
      display: none;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }

    /* ── Camera button ── */
    .camera-btn-row { display: flex; margin-top: 10px; }
    .camera-btn {
      flex: 1;
      padding: 12px;
      background: #fff;
      color: var(--purple);
      border: 2px solid #c4b5fd;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .2s, border-color .2s;
    }
    .camera-btn:hover { background: var(--purple-light); border-color: var(--purple); }

    /* ── Segmented toggle（入力方法・宛先） ── */
    .seg-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .seg-toggle input { display: none; }
    .seg-toggle label {
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .seg-toggle input:checked + label {
      border-color: var(--purple);
      background: var(--purple-light);
      color: #4c1d95;
    }

    /* ── PDF ── */
    #pdfCard { display: none; }
    #pdfInput { display: none; }
    .pdf-info { font-size: 13px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
    .pdf-info strong { color: var(--text); }
    .pdf-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 14px;
    }
    .pdf-row select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    /* ── Analyze button ── */
    .analyze-btn {
      width: 100%;
      padding: 16px;
      background: var(--purple-grad);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      letter-spacing: .3px;
    }
    .analyze-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-1px); }
    .analyze-btn:active:not(:disabled) { transform: translateY(0); }
    .analyze-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Status ── */
    .status {
      display: none;
      text-align: center;
      padding: 14px;
      font-size: 14px;
      color: var(--muted);
    }
    .status.visible { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-box {
      display: none;
      background: #fee2e2;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .error-box.visible { display: block; }

    /* ── Score Grid ── */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .score-chip {
      background: var(--gray-bg);
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
    }
    .score-chip .subj { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .score-chip .dev  { font-size: 20px; font-weight: 800; line-height: 1; }
    .score-chip .pts  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .score-chip.high .dev { color: var(--emerald); }
    .score-chip.mid  .dev { color: var(--amber); }
    .score-chip.low  .dev { color: var(--red); }

    /* ── Result text ── */
    .result-text {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Copy button ── */
    .copy-btn {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      background: var(--green-line);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s, transform .1s;
    }
    .copy-btn:hover { background: #05a847; transform: translateY(-1px); }
    .copy-btn:active { transform: translateY(0); }
    .copy-btn.copied { background: var(--green-dark); }

    #resultCard, #batchCard { display: none; }

    /* ── Batch (PDF) results ── */
    .batch-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .batch-progress { font-size: 13px; color: var(--muted); }
    .copy-all-btn {
      padding: 8px 12px;
      background: #fff;
      color: var(--green-dark);
      border: 2px solid var(--green-line);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .student-item {
      border-top: 1px solid var(--border);
      margin-top: 16px;
      padding-top: 16px;
    }
    .student-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .student-state { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .student-state.done  { color: var(--emerald); }
    .student-state.error { color: var(--red); }
    .retry-btn {
      margin-top: 8px;
      padding: 10px 14px;
      background: #fff;
      color: var(--purple);
      border: 2px solid #c4b5fd;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .score-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 北辰テスト 成績分析</h1>
  <p>成績表の写真をアップロードしてAIが分析・フィードバックします</p>
</div>

<div class="container">

  <!-- Mode -->
  <div class="card">
    <div class="card-title">📥 読み込み方法</div>
    <div class="seg-toggle">
      <input type="radio" name="mode" id="modePhoto" value="photo" checked />
      <label for="modePhoto">📷 写真（1人分）</label>
      <input type="radio" name="mode" id="modePdf" value="pdf" />
      <label for="modePdf">📑 PDF（複数人）</label>
    </div>
  </div>

  <!-- Upload -->
  <div class="card" id="photoCard">
    <div class="card-title">📷 成績表の写真（最大4枚）</div>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📄</div>
      <div class="upload-label">ここをタップして写真を選択</div>
      <div class="upload-sub">JPG / PNG / HEIC 対応 ／ ドラッグ＆ドロップも可</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" />
    <div class="thumb-grid" id="thumbGrid"></div>
    <div class="thumb-count" id="thumbCount"></div>
    <div class="camera-btn-row">
      <button class="camera-btn" id="cameraBtn">📸 カメラで撮影する</button>
    </div>
    <div class="error-box" id="uploadError"></div>
  </div>

  <!-- PDF upload -->
  <div class="card" id="pdfCard">
    <div class="card-title">📑 成績表のPDF（複数人分）</div>
    <div class="upload-zone" id="pdfZone">
      <div class="upload-icon">📑</div>
      <div class="upload-label" id="pdfLabel">ここをタップしてPDFを選択</div>
      <div class="upload-sub">ドラッグ＆ドロップも可 ／ 最大100ページ</div>
    </div>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf" />
    <div class="pdf-row">
      <label for="pagesPerStudent">1人あたりのページ数</label>
      <select id="pagesPerStudent">
        <option value="1">1ページ</option>
        <option value="2">2ページ</option>
        <option value="3">3ページ</option>
        <option value="4">4ページ</option>
      </select>
    </div>
    <div class="pdf-info" id="pdfInfo"></div>
    <div class="error-box" id="pdfError"></div>
  </div>

  <!-- Audience -->
  <div class="card">
    <div class="card-title">✉️ メッセージの宛先</div>
    <div class="seg-toggle">
      <input type="radio" name="audience" id="audStudent" value="student" checked />
      <label for="audStudent">🧑‍🎓 生徒向け</label>
      <input type="radio" name="audience" id="audParent" value="parent" />
      <label for="audParent">👪 保護者様向け</label>
    </div>
  </div>

  <!-- Analyze -->
  <button class="analyze-btn" id="analyzeBtn" disabled>🔍 成績を分析する</button>

  <!-- Status -->
  <div class="status" id="statusArea">
    <div class="spinner"></div>
    <span id="statusText">分析中...</span>
  </div>

  <!-- Error -->
  <div class="error-box" id="apiError"></div>

  <!-- Result -->
  <div class="card" id="resultCard">
    <div class="card-title">📊 分析結果</div>
    <div class="score-grid" id="scoreGrid"></div>
    <div class="result-text" id="resultText"></div>
    <button class="copy-btn" id="copyBtn">
      <span>📋</span><span id="copyLabel">LINEメッセージをコピー</span>
    </button>
  </div>

  <!-- Batch result -->
  <div class="card" id="batchCard">
    <div class="batch-head">
      <div class="card-title" style="margin-bottom:0">📊 分析結果</div>
      <button class="copy-all-btn" id="copyAllBtn">全員分コピー</button>
    </div>
    <div class="batch-progress" id="batchProgress"></div>
    <div id="batchList"></div>
  </div>

</div><!-- /container -->

<script src="/vendor/pdf.min.js"></script>
<script>
'use strict';

const API_URL  = '/api/analyze';
const SUBJECTS = ['英語', '数学', '国語', '理科', '社会'];
const MAX_IMGS = 4;
const MAX_SIDE = 2000; // 送信前に縮小する長辺(px)
const MAX_PDF_PAGES = 100;
const CONCURRENCY   = 2; // PDF で同時に分析する人数

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';

/* ── DOM refs ── */
const $ = id => document.getElementById(id);
const uploadZone  = $('uploadZone');
const fileInput   = $('fileInput');
const cameraInput = $('cameraInput');
const cameraBtn   = $('cameraBtn');
const thumbGrid   = $('thumbGrid');
const thumbCount  = $('thumbCount');
const analyzeBtn  = $('analyzeBtn');
const statusArea  = $('statusArea');
const statusText  = $('statusText');
const resultCard  = $('resultCard');
const scoreGrid   = $('scoreGrid');
const resultText  = $('resultText');
const copyBtn     = $('copyBtn');
const copyLabel   = $('copyLabel');
const uploadError = $('uploadError');
const apiError    = $('apiError');
const photoCard   = $('photoCard');
const pdfCard     = $('pdfCard');
const pdfZone     = $('pdfZone');
const pdfInput    = $('pdfInput');
const pdfLabel    = $('pdfLabel');
const pdfInfo     = $('pdfInfo');
const pdfError    = $('pdfError');
const pagesPerStudent = $('pagesPerStudent');
const batchCard     = $('batchCard');
const batchList     = $('batchList');
const batchProgress = $('batchProgress');
const copyAllBtn    = $('copyAllBtn');

let images = []; // [{base64: string, type: string}, ...]
let cachedScores = null; // 同じ写真で宛先だけ変えたときは読み取りを省略する
let pdfPages = [];       // PDF 各ページを JPEG 化したもの [{base64, type}, ...]
let students = [];       // [{index, pages, images, scores, msg, error}, ...]
let busy = false;

const currentMode = () => document.querySelector('input[name="mode"]:checked').value;
const currentAudience = () => document.querySelector('input[name="audience"]:checked').value;

/* ── Mode ── */
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', () => {
  const pdf = currentMode() === 'pdf';
  photoCard.style.display = pdf ? 'none' : '';
  pdfCard.style.display   = pdf ? 'block' : 'none';
  resultCard.style.display = 'none';
  batchCard.style.display  = 'none';
  hideError(apiError);
  refreshBtn();
}));

/* ── Upload zone ── */
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) addFiles(fileInput.files);
  fileInput.value = '';
});
cameraBtn.addEventListener('click', () => cameraInput.click());
cameraInput.addEventListener('change', () => {
  if (cameraInput.files.length) addFiles(cameraInput.files);
  cameraInput.value = '';
});

function addFiles(files) {
  hideError(uploadError);
  const slots = MAX_IMGS - images.length;
  if (slots <= 0) {
    showError(uploadError, `写真は最大${MAX_IMGS}枚までです。不要な写真を削除してから追加してください。`);
    return;
  }
  const toAdd = Array.from(files).filter(f => f.type.startsWith('image/')).slice(0, slots);
  if (toAdd.length === 0) {
    showError(uploadError, '画像ファイル（JPG / PNG など）を選択してください。');
    return;
  }
  analyzeBtn.disabled = true;
  Promise.allSettled(toAdd.map(toJpeg)).then(results => {
    let failed = 0;
    results.forEach(r => {
      if (r.status === 'fulfilled') images.push(r.value);
      else failed++;
    });
    if (failed) {
      showError(uploadError, `${failed}枚の写真を読み込めませんでした。JPG / PNG 形式で保存し直すか、カメラで撮影してください。`);
    }
    cachedScores = null;
    renderThumbs();
    refreshBtn();
  });
}

/* 写真をブラウザ内で JPEG に変換・縮小する（iPhone の HEIC 写真や大きな写真も送れるように） */
function toJpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve({ base64: canvas.toDataURL('image/jpeg', 0.88).split(',')[1], type: 'image/jpeg' });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
    img.src = url;
  });
}

function removeImage(index) {
  images.splice(index, 1);
  cachedScores = null;
  renderThumbs();
  refreshBtn();
}

function renderThumbs() {
  if (images.length === 0) {
    uploadZone.style.display = '';
    thumbGrid.classList.remove('visible');
    thumbCount.style.display = 'none';
    return;
  }

  uploadZone.style.display = 'none';
  thumbGrid.classList.add('visible');
  thumbCount.style.display = 'block';
  thumbCount.textContent = `${images.length}枚 選択中 / 最大${MAX_IMGS}枚`;

  thumbGrid.innerHTML = '';
  images.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'thumb-item';
    const el = document.createElement('img');
    el.src = `data:${img.type};base64,${img.base64}`;
    el.alt = `成績表${i + 1}`;
    const del = document.createElement('button');
    del.className = 'thumb-delete';
    del.title = '削除';
    del.textContent = '✕';
    del.addEventListener('click', () => removeImage(i));
    item.append(el, del);
    thumbGrid.appendChild(item);
  });

  if (images.length < MAX_IMGS) {
    const add = document.createElement('div');
    add.className = 'thumb-add';
    add.title = '写真を追加';
    add.textContent = '＋';
    add.addEventListener('click', () => fileInput.click());
    thumbGrid.appendChild(add);
  }
}

function refreshBtn() {
  analyzeBtn.disabled = busy || (currentMode() === 'pdf' ? pdfPages.length === 0 : images.length === 0);
}

/* ── PDF upload ── */
pdfZone.addEventListener('click', () => { if (!busy) pdfInput.click(); });
pdfZone.addEventListener('dragover', e => { e.preventDefault(); pdfZone.classList.add('drag-over'); });
pdfZone.addEventListener('dragleave', () => pdfZone.classList.remove('drag-over'));
pdfZone.addEventListener('drop', e => {
  e.preventDefault();
  pdfZone.classList.remove('drag-over');
  if (!busy && e.dataTransfer.files.length) loadPdf(e.dataTransfer.files[0]);
});
pdfInput.addEventListener('change', () => {
  if (pdfInput.files.length) loadPdf(pdfInput.files[0]);
  pdfInput.value = '';
});
pagesPerStudent.addEventListener('change', () => { students = []; renderPdfInfo(); });

async function loadPdf(file) {
  hideError(pdfError);
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
    showError(pdfError, 'PDFファイルを選択してください。');
    return;
  }
  if (!window.pdfjsLib) {
    showError(pdfError, 'PDF読み込み機能を準備できませんでした。ページを再読み込みしてください。');
    return;
  }
  pdfPages = [];
  students = [];
  renderPdfInfo();
  busy = true;
  refreshBtn();
  try {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    if (pdf.numPages > MAX_PDF_PAGES) {
      showError(pdfError, `PDFは最大${MAX_PDF_PAGES}ページまでです（このPDFは${pdf.numPages}ページ）。分割してから読み込んでください。`);
      return;
    }
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      pdfInfo.textContent = `PDFを読み込んでいます…（${i} / ${pdf.numPages}ページ）`;
      pages.push(await renderPdfPage(await pdf.getPage(i)));
    }
    pdfPages = pages;
    pdfLabel.textContent = `📑 ${file.name}（タップで選び直し）`;
  } catch {
    showError(pdfError, 'PDFを読み込めませんでした。ファイルが壊れていないか確認してください。');
  } finally {
    busy = false;
    renderPdfInfo();
    refreshBtn();
  }
}

async function renderPdfPage(page) {
  const base = page.getViewport({ scale: 1 });
  const viewport = page.getViewport({ scale: MAX_SIDE / Math.max(base.width, base.height) });
  const canvas = document.createElement('canvas');
  canvas.width  = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; // 透明部分が JPEG で黒くならないように
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport }).promise;
  return { base64: canvas.toDataURL('image/jpeg', 0.88).split(',')[1], type: 'image/jpeg' };
}

function renderPdfInfo() {
  if (pdfPages.length === 0) { pdfInfo.textContent = ''; return; }
  const per = Number(pagesPerStudent.value);
  const count = Math.ceil(pdfPages.length / per);
  pdfInfo.innerHTML = '';
  const strong = document.createElement('strong');
  strong.textContent = `全${pdfPages.length}ページ → ${count}人分`;
  pdfInfo.append(strong, `として分析します（1人${per}ページずつ、先頭から順に区切ります）。`);
  if (pdfPages.length % per !== 0) {
    pdfInfo.append(`\n⚠️ ページ数が${per}で割り切れません。最後の人は${pdfPages.length % per}ページになります。`);
    pdfInfo.style.whiteSpace = 'pre-line';
  }
}

function buildStudents() {
  const per = Number(pagesPerStudent.value);
  const list = [];
  for (let i = 0; i < pdfPages.length; i += per) {
    const end = Math.min(i + per, pdfPages.length);
    list.push({
      index: list.length + 1,
      pages: per === 1 ? `p.${i + 1}` : `p.${i + 1}–${end}`,
      images: pdfPages.slice(i, end),
      scores: null, msg: null, error: null,
    });
  }
  return list;
}

/* ── Analyze ── */
analyzeBtn.addEventListener('click', async () => {
  if (currentMode() === 'pdf') return analyzeBatch();
  if (images.length === 0) return;

  setUI(true);
  hideError(apiError);
  resultCard.style.display = 'none';

  try {
    if (!cachedScores) {
      setStatus('📸 成績表を読み取っています…');
      cachedScores = await extractScores(images);
    }
    const scores = cachedScores;

    const audience = currentAudience();
    setStatus(audience === 'parent'
      ? '✍️ 保護者様向けメッセージを作成しています…'
      : '✍️ フィードバックを生成しています…');
    const msg = await generateAdvice(scores, audience, images);

    displayResults(scores, msg);
  } catch (err) {
    showError(apiError, err.message);
  } finally {
    setUI(false);
  }
});

/* ── PDF: 複数人をまとめて分析 ── */
async function analyzeBatch() {
  if (pdfPages.length === 0) return;
  // ページ区切りが同じなら読み取り済みの成績を使い回し、宛先だけ変えて作り直せるようにする
  if (students.length === 0) students = buildStudents();
  const audience = currentAudience();
  students.forEach(st => { st.msg = null; st.error = null; });

  setUI(true);
  hideError(apiError);
  resultCard.style.display = 'none';
  setStatus(`✍️ ${students.length}人分を分析しています…（数分かかる場合があります）`);
  renderBatch();
  batchCard.style.display = 'block';

  const queue = students.slice();
  const worker = async () => {
    while (queue.length) await processStudent(queue.shift(), audience);
  };
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));

  setUI(false);
}

async function processStudent(st, audience) {
  st.state = st.scores ? '✍️ 作成中…' : '📸 読み取り中…';
  st.error = null;
  updateStudent(st);
  try {
    if (!st.scores) {
      st.scores = await extractScores(st.images);
      st.state = '✍️ 作成中…';
      updateStudent(st);
    }
    st.msg = await generateAdvice(st.scores, audience, st.images);
  } catch (err) {
    st.error = err.message;
  }
  st.state = null;
  updateStudent(st);
}

function renderBatch() {
  batchList.innerHTML = '';
  students.forEach(st => {
    st.el = document.createElement('div');
    st.el.className = 'student-item';
    batchList.appendChild(st.el);
    updateStudent(st);
  });
}

function updateStudent(st) {
  const el = st.el;
  el.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'student-title';
  const name = document.createElement('span');
  const readName = st.scores && st.scores.student_name;
  name.textContent = `${st.index}人目（${st.pages}）${readName ? ' ' + readName : ''}`;
  const state = document.createElement('span');
  state.className = 'student-state' + (st.msg ? ' done' : st.error ? ' error' : '');
  state.textContent = st.msg ? '✅ 完了' : st.error ? '⚠️ エラー' : (st.state || '⏳ 待機中');
  title.append(name, state);
  el.appendChild(title);

  if (st.scores) {
    const grid = document.createElement('div');
    grid.className = 'score-grid';
    renderScoreGrid(grid, st.scores);
    el.appendChild(grid);
  }
  if (st.msg) {
    const text = document.createElement('div');
    text.className = 'result-text';
    text.textContent = st.msg;
    const btn = makeCopyButton(() => st.msg);
    el.append(text, btn);
  }
  if (st.error) {
    const err = document.createElement('div');
    err.className = 'error-box visible';
    err.textContent = st.error;
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.textContent = '🔄 この人だけ再試行';
    retry.addEventListener('click', async () => {
      retry.disabled = true;
      await processStudent(st, currentAudience());
      updateProgress();
    });
    el.append(err, retry);
  }
  updateProgress();
}

function updateProgress() {
  const done = students.filter(st => st.msg).length;
  const failed = students.filter(st => st.error).length;
  batchProgress.textContent = `${done} / ${students.length}人 完了` + (failed ? `・エラー${failed}人` : '');
}

copyAllBtn.addEventListener('click', async () => {
  const text = students
    .filter(st => st.msg)
    .map(st => `■ ${st.index}人目（${st.pages}）${st.scores?.student_name ? ' ' + st.scores.student_name : ''}\n${st.msg}`)
    .join('\n\n');
  if (!text) return;
  await copyText(text);
  flashCopied(copyAllBtn, copyAllBtn, '全員分コピー');
});

/* ── Step 1: extract scores ── */
async function extractScores(imgs) {
  const prompt =
`この北辰テストの成績表から以下の情報をJSON形式で抽出してください。
必ずJSON形式のみで返答し、余分なテキストは不要です。
{
  "student_name": "生徒の氏名",
  "subjects": {
    "英語": {"score": 点数, "deviation": 偏差値},
    "数学": {"score": 点数, "deviation": 偏差値},
    "国語": {"score": 点数, "deviation": 偏差値},
    "理科": {"score": 点数, "deviation": 偏差値},
    "社会": {"score": 点数, "deviation": 偏差値}
  },
  "total_deviation": 5教科合計偏差値
}
読み取れない場合はnullを入れてください。`;

  const raw = (await callAPI(prompt, 4000, imgs)).text;

  let jsonStr = null;
  const codeBlock = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (codeBlock) {
    jsonStr = codeBlock[1].trim();
  } else {
    const obj = raw.match(/\{[\s\S]*\}/);
    if (obj) jsonStr = obj[0];
  }
  if (!jsonStr) {
    throw new Error('成績データを画像から読み取れませんでした。写真がはっきり写っているか確認してください。');
  }
  try {
    return JSON.parse(jsonStr);
  } catch {
    throw new Error('成績データの解析に失敗しました。写真を撮り直して再度お試しください。');
  }
}

/* ── Step 2: generate LINE advice ── */
async function generateAdvice(scores, audience, imgs) {
  const subjects = scores.subjects || {};
  const lines = SUBJECTS
    .filter(s => subjects[s] && subjects[s].deviation != null)
    .map(s => {
      const d = subjects[s];
      return `${s}: 偏差値${d.deviation}${d.score != null ? `（${d.score}点）` : ''}`;
    });

  if (lines.length === 0) throw new Error('偏差値データが見つかりませんでした。成績表が正しく写っているか確認してください。');

  if (scores.total_deviation != null) {
    lines.push(`5教科合計偏差値: ${scores.total_deviation}`);
  }

  const prompt = audience === 'parent' ? parentPrompt(lines) : studentPrompt(lines);
  return (await callAPI(prompt, 8000, imgs)).text;
}

function studentPrompt(lines) {
  return (
`あなたは中学生を担当する塾の先生です。
添付の北辰テスト成績表の画像と以下の成績データをもとに、生徒にLINEで送るフィードバックメッセージを作ってください。

【成績データ】
${lines.join('\n')}

【アドバイスの方針】

1. 正答率が高い（50%以上）のに間違えた問題を「必ず正解しておきたい問題」として具体的に指摘

【注意事項】
- 画像から読み取れた具体的な数値（正答率○○%・大問番号）を必ず使う

【出力フォーマット（このテキストのみ出力）】

━━━━━━━━━━━━━
【教科名】偏差値XX
（アドバイス文）

━━━━━━━━━━━━━
💪 総評
（全体を通じた前向きな一言メッセージ）
━━━━━━━━━━━━━

前後の説明文や補足は不要です。フォーマット通りのテキストのみ出力してください。`);
}

function parentPrompt(lines) {
  return (
`あなたは中学生を担当する塾の先生です。
添付の北辰テスト成績表の画像と以下の成績データをもとに、生徒の保護者様にLINEで送る結果報告のメッセージを作ってください。

【成績データ】
${lines.join('\n')}

【メッセージの方針】

- 家庭での学習方法やサポートのお願いは書かない
- 生徒の名前は書かず「〇〇さん」と表記する（先生が送信前に書き換えます）
- 専門用語は避け、保護者様に分かりやすい言葉にする
- 絵文字は使わないか、使っても全体で1〜2個までにする
- LINEで読みやすいよう適切に改行を入れる

【出力フォーマット（このテキストのみ出力）】
いつもお世話になっております。
先日の北辰テストの結果についてご報告いたします。

【5教科】偏差値XX
（全体の結果についての短い報告）

【教科名】偏差値XX
（その教科の良かった点・今後の課題を2〜3文で）

【総評】
（〇〇さんの頑張りを認め、次回に向けた前向きなメッセージ）

今後とも〇〇さんの成長をしっかりと支えてまいりますので、どうぞよろしくお願いいたします。

前後の説明文や補足は不要です。フォーマット通りのテキストのみ出力してください。`);
}

/* ── API call via local server ── */
async function callAPI(prompt, maxTokens, imgs) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, images: imgs.map(img => img.base64), maxTokens })
    });
  } catch (networkErr) {
    throw new Error('サーバーに接続できませんでした。サーバーが起動しているか確認し、しばらく待ってから再度お試しください。');
  }

  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(body.error?.message || `エラーが発生しました (HTTP ${res.status})`);
  }
  return body;
}

/* ── Display ── */
function displayResults(scores, msg) {
  renderScoreGrid(scoreGrid, scores);
  resultText.textContent = msg;
  resultCard.style.display = 'block';
  setTimeout(() => resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function renderScoreGrid(grid, scores) {
  grid.innerHTML = '';
  const subjects = scores.subjects || {};
  SUBJECTS.forEach(s => {
    const d = subjects[s];
    if (!d || d.deviation == null) return;
    const dev   = d.deviation;
    const level = dev >= 60 ? 'high' : dev >= 50 ? 'mid' : 'low';
    const chip  = document.createElement('div');
    chip.className = `score-chip ${level}`;
    [['subj', s], ['dev', dev], ['pts', d.score != null ? d.score + '点' : '―']].forEach(([cls, text]) => {
      const el = document.createElement('div');
      el.className = cls;
      el.textContent = text;
      chip.appendChild(el);
    });
    grid.appendChild(chip);
  });
}

/* ── Copy ── */
copyBtn.addEventListener('click', async () => {
  const text = resultText.textContent;
  if (!text) return;
  await copyText(text);
  flashCopied(copyBtn, copyLabel, 'LINEメッセージをコピー');
});

function makeCopyButton(getText) {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  const icon = document.createElement('span');
  icon.textContent = '📋';
  const label = document.createElement('span');
  label.textContent = 'LINEメッセージをコピー';
  btn.append(icon, label);
  btn.addEventListener('click', async () => {
    await copyText(getText());
    flashCopied(btn, label, 'LINEメッセージをコピー');
  });
  return btn;
}

function flashCopied(btn, label, original) {
  btn.classList.add('copied');
  label.textContent = 'コピーしました！';
  setTimeout(() => {
    btn.classList.remove('copied');
    label.textContent = original;
  }, 2500);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    Object.assign(ta.style, { position: 'fixed', opacity: '0', top: '0', left: '0' });
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

/* ── Helpers ── */
function setUI(loading) {
  busy = loading;
  refreshBtn();
  document.querySelectorAll('input[name="mode"]').forEach(r => { r.disabled = loading; });
  pagesPerStudent.disabled = loading;
  statusArea.className = 'status' + (loading ? ' visible' : '');
}
function setStatus(msg) { statusText.textContent = msg; }
function showError(el, msg) { el.textContent = msg; el.classList.add('visible'); }
function hideError(el) { el.classList.remove('visible'); }
